    <rect x="12" y="12" width="152" height="98" rx="4" fill="#191126" />
    <text x="88" y="53" fill="#ff4fa3" font-family="sans-serif" font-size="30" font-weight="700" text-anchor="middle">東京</text>
    <text x="88" y="82" fill="#00d9ff" font-family="monospace" font-size="11" text-anchor="middle" letter-spacing="2">NIGHT SHIFT</text>
  </g>

  <g transform="translate(783 72)">
