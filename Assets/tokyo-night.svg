    <rect x="0" y="0" width="546" height="38" rx="14" fill="#18132a" />
    <rect y="26" width="546" height="12" fill="#18132a" />
    <circle cx="25" cy="19" r="5" fill="#ff4fa3" /><circle cx="44" cy="19" r="5" fill="#a855f7" /><circle cx="63" cy="19" r="5" fill="#00d9ff" />
