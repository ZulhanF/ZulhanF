<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 420" role="img" aria-labelledby="title desc">
  <title id="title">Tokyo Night Terminal</title>
  <desc id="desc">A neon-lit Tokyo-inspired city at night with a developer terminal.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05050b" />
      <stop offset="0.55" stop-color="#120b22" />
      <stop offset="1" stop-color="#071a28" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171325" />
      <stop offset="1" stop-color="#05050b" />
    </linearGradient>
    <linearGradient id="window" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e1934" />
      <stop offset="1" stop-color="#080b16" />
    </linearGradient>
    <filter id="pinkGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <filter id="cyanGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1440" height="420" fill="url(#sky)" />
  <circle cx="210" cy="73" r="42" fill="#ff4fa3" opacity="0.22" filter="url(#pinkGlow)" />
  <circle cx="210" cy="73" r="27" fill="#ff8ac3" opacity="0.45" />
  <circle cx="1270" cy="90" r="57" fill="#00d9ff" opacity="0.10" filter="url(#cyanGlow)" />

  <g fill="#e6edf3" opacity="0.6">
    <circle cx="83" cy="43" r="1.3" /><circle cx="376" cy="54" r="1" /><circle cx="539" cy="31" r="1.3" />
    <circle cx="653" cy="74" r="1" /><circle cx="1026" cy="38" r="1.3" /><circle cx="1170" cy="52" r="1" />
    <circle cx="1360" cy="44" r="1.3" /><circle cx="1332" cy="155" r="1" /><circle cx="601" cy="159" r="1" />
  </g>

  <g opacity="0.38" stroke="#6f5b87" stroke-width="1">
