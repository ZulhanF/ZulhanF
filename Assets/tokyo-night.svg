    <g font-family="monospace" font-size="15">
      <text x="26" y="76" fill="#ff4fa3">$</text><text x="48" y="76" fill="#e6edf3">whoami</text>
      <text x="48" y="105" fill="#00d9ff">software developer / night mode</text>
      <text x="26" y="143" fill="#ff4fa3">$</text><text x="48" y="143" fill="#e6edf3">build --ideas</text>
