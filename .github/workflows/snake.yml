name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate neon contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D9007F&color_dots=%230D0B14,%23311A4A,%236A2C91,%2300B8D4,%23FF4FA3
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23FF4FA3&color_dots=%2316111F,%233B1D5A,%236D28D9,%2300D9FF,%23FF4FA3

      - name: Publish snake files to output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
